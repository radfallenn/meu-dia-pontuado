<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Meu Dia Pro</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="visual.css">
</head>
<body>
<div id="root"></div>
<script src="app.js"></script>
<script src="status.js"></script>
<script src="v23.js"></script>
<script src="score.js"></script>
<script>
(function(){
  if(window.__MDP_IMPORT_TEXT_FIX__) return;
  window.__MDP_IMPORT_TEXT_FIX__ = true;
  const url = () => (localStorage.getItem('rasp_backend_url') || 'http://192.168.1.70:8887').replace(/\/$/, '');
  const headers = () => {
    const h = {'Content-Type':'application/json'};
    const token = localStorage.getItem('rasp_backend_token') || '';
    if(token) h['X-Meu-Dia-Token'] = token;
    return h;
  };
  const now = () => new Date().toISOString();
  const uid = () => 't_' + Date.now() + '_' + Math.random().toString(16).slice(2);
  function normalize(state){
    state = state && typeof state === 'object' ? state : {tarefas:[],projetos:[],arquivo:[]};
    state.tarefas = Array.isArray(state.tarefas) ? state.tarefas : [];
    state.projetos = Array.isArray(state.projetos) ? state.projetos : [];
    state.arquivo = Array.isArray(state.arquivo) ? state.arquivo : [];
    state.tarefas.forEach(t => { if(!t.id) t.id = uid(); if(!t.createdAt) t.createdAt = now(); if(!t.updatedAt) t.updatedAt = t.createdAt; });
    return state;
  }
  function getLocal(){
    try{
      if(window.state && Array.isArray(window.state.tarefas)) return normalize(window.state);
      const raw = localStorage.getItem('meu_dia_pro_v2') || localStorage.getItem('tarefas_whatsapp_v1');
      const parsed = raw ? JSON.parse(raw) : {tarefas:[],projetos:[],arquivo:[]};
      return normalize(Array.isArray(parsed) ? {tarefas:parsed,projetos:[],arquivo:[]} : parsed);
    }catch(e){ return {tarefas:[],projetos:[],arquivo:[]}; }
  }
  function setLocal(state){
    state = normalize(state);
    try{
      if(window.state){ Object.keys(window.state).forEach(k => delete window.state[k]); Object.assign(window.state, state); }
      localStorage.setItem('meu_dia_pro_v2', JSON.stringify(state));
      if(typeof window.render === 'function') window.render();
    }catch(e){}
  }
  function newer(a,b){ return new Date((a && (a.updatedAt || a.createdAt)) || 0).getTime() >= new Date((b && (b.updatedAt || b.createdAt)) || 0).getTime(); }
  function merge(a,b){
    a = normalize(a); b = normalize(b);
    const map = new Map();
    [...(b.tarefas||[]), ...(a.tarefas||[])].forEach(t => {
      if(!t.id) t.id = uid();
      const old = map.get(t.id);
      if(!old || newer(t, old)) map.set(t.id, Object.assign({}, old || {}, t));
    });
    return Object.assign({}, b, a, {tarefas:[...map.values()].filter(t => !t.deleted)});
  }
  function status(text){
    const e = document.getElementById('mdp42Status') || document.getElementById('mdp41Status') || document.getElementById('mdp40Status');
    if(e) e.textContent = text;
  }
  async function push(state){
    try{
      const payload = {device:'apk-android-text-import', savedAt:now(), state:state, config:{}};
      const r = await fetch(url() + '/api/state', {method:'POST', headers:headers(), body:JSON.stringify(payload)});
      const j = await r.json().catch(() => ({}));
      return !!j.ok;
    }catch(e){ return false; }
  }
  async function importText(){
    const box = document.getElementById('mdp42Paste') || document.getElementById('mdp41Paste') || document.querySelector('textarea[placeholder*="JSON"]');
    const text = box ? box.value : '';
    if(!text || !text.trim()){ status('Cole um JSON antes de importar.'); return; }
    try{
      const json = JSON.parse(text);
      const incoming = json.state || json;
      const merged = merge(getLocal(), incoming);
      setLocal(merged);
      status('JSON colado importado. Salvando no MongoDB...');
      const ok = await push(merged);
      status(ok ? 'JSON importado e sincronizado com sucesso.' : 'JSON importado localmente. Backend offline.');
      if(typeof window.mdpPull === 'function') setTimeout(() => window.mdpPull(true), 800);
    }catch(e){
      status('JSON colado inválido. Copie o backup completo.');
    }
  }
  window.mdpImportTextFix = importText;
  document.addEventListener('click', function(e){
    const el = e.target && e.target.closest ? e.target.closest('button,[data-mdp-action]') : null;
    if(!el) return;
    const action = el.getAttribute('data-mdp-action') || '';
    const text = (el.innerText || el.textContent || '').toLowerCase();
    if(action === 'paste' || text.includes('importar do texto')){
      e.preventDefault();
      e.stopPropagation();
      importText();
    }
  }, true);
  setInterval(function(){
    document.querySelectorAll('button').forEach(btn => {
      const text = (btn.innerText || btn.textContent || '').toLowerCase();
      if(text.includes('importar do texto') && !btn.dataset.fixedPaste){
        btn.dataset.fixedPaste = '1';
        btn.onclick = function(ev){ ev.preventDefault(); importText(); return false; };
      }
    });
  }, 1000);
})();
</script>
</body>
</html>
